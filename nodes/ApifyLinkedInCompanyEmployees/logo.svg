  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0A66C2"/>
  <!-- team member, back left -->
  <circle cx="20.5" cy="23.5" r="5.5" fill="#CFE3F7"/>
  <path d="M11 39 a9.5 8.5 0 0 1 19 0 Z" fill="#CFE3F7"/>
  <!-- team member, back right -->
  <circle cx="43.5" cy="23.5" r="5.5" fill="#CFE3F7"/>
  <path d="M34 39 a9.5 8.5 0 0 1 19 0 Z" fill="#CFE3F7"/>
  <!-- team member, front (outlined in the badge color so it reads in front) -->
